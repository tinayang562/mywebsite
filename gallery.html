<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集 — Tina Yang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>

  .page-head {
    max-width: 980px;
    margin: 0 auto;
    padding: 72px 24px 8px;
  }

  .page-head h1 {
    font-size: clamp(2rem, 5vw, 2.8rem);
    font-style: italic;
  }

  /* ---------- Category tabs ---------- */
  .tabs {
    max-width: 980px;
    margin: 32px auto 8px;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .tab-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.95rem;
    padding: 9px 20px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .tab-btn:hover {
    border-color: var(--clay);
  }

  .tab-btn.active {
    background: var(--clay);
    border-color: var(--clay);
    color: #fff;
  }

  /* ---------- Grid ---------- */
  .grid {
    max-width: 1040px;
    margin: 0 auto;
    padding: 40px 24px 100px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 46px 30px;
  }

  .grid .art-frame:nth-child(3n+1) { transform: rotate(-3deg); }
  .grid .art-frame:nth-child(3n+2) { transform: rotate(2deg); margin-top: 20px; }
  .grid .art-frame:nth-child(3n+3) { transform: rotate(-1.5deg); }

  .grid .art-frame:hover {
    transform: rotate(0deg) scale(1.03);
    transition: transform 0.3s ease;
  }

  .piece { display: none; }
  .piece.show { display: block; }

  @media (max-width: 860px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 540px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="brand">Tina Yang</div>
  <div class="links">
    <a href="index.html">主页</a>
    <a href="gallery.html" class="active">作品集</a>
    <a href="index.html#about">关于</a>
  </div>
</nav>

<section class="page-head">
  <h1>完整作品集</h1>
</section>

<div class="tabs" id="tabs">
  <button class="tab-btn active" data-cat="all">全部</button>
  <button class="tab-btn" data-cat="painting">绘画</button>
  <button class="tab-btn" data-cat="oil">油画</button>
  <button class="tab-btn" data-cat="print">版画</button>
  <button class="tab-btn" data-cat="craft">手工</button>
</div>

<section class="grid" id="grid">

  <div class="piece show" data-cat="painting">
    <div class="art-frame">
      <div class="pin"></div>
      <div class="surface" style="background:linear-gradient(135deg,#D2B48C,#B15E3F);color:#fff;">替换为你的作品图片</div>
      <div class="cap">静物一<span class="medium">绘画 · 2026</span></div>
    </div>
  </div>

  <div class="piece show" data-cat="oil">
    <div class="art-frame">
      <div class="pin"></div>
      <div class="surface" style="background:linear-gradient(135deg,#C98A63,#8B5D6B);color:#fff;">替换为你的作品图片</div>
      <div class="cap">午后<span class="medium">油画 · 2026</span></div>
    </div>
  </div>

  <div class="piece show" data-cat="print">
    <div class="art-frame">
      <div class="pin"></div>
      <div class="surface" style="background:linear-gradient(135deg,#8FA07C,#6F7C5B);color:#fff;">替换为你的作品图片</div>
      <div class="cap">木刻 No.3<span class="medium">版画 · 2025</span></div>
    </div>
  </div>

  <div class="piece show" data-cat="craft">
    <div class="art-frame">
      <div class="pin"></div>
      <div class="surface" style="background:linear-gradient(135deg,#A87B8D,#6F7C5B);color:#fff;">替换为你的作品图片</div>
      <div class="cap">编织小物<span class="medium">手工 · 2025</span></div>
    </div>
  </div>

  <div class="piece show" data-cat="painting">
    <div class="art-frame">
      <div class="pin"></div>
      <div class="surface" style="background:linear-gradient(135deg,#B15E3F,#6F7C5B);color:#fff;">替换为你的作品图片</div>
      <div class="cap">窗边<span class="medium">绘画 · 2025</span></div>
    </div>
  </div>

  <div class="piece show" data-cat="oil">
    <div class="art-frame">
      <div class="pin"></div>
      <div class="surface" style="background:linear-gradient(135deg,#D2B48C,#8B5D6B);color:#fff;">替换为你的作品图片</div>
      <div class="cap">海岸线<span class="medium">油画 · 2024</span></div>
    </div>
  </div>

</section>

<footer style="max-width:980px;margin:0 auto;padding:0 24px 60px;color:var(--sage);font-size:0.85rem;">
  © 2026 Tina Yang
</footer>

<script>
  const tabs = document.querySelectorAll('.tab-btn');
  const pieces = document.querySelectorAll('.piece');

  function setActive(cat) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
    pieces.forEach(p => {
      p.classList.toggle('show', cat === 'all' || p.dataset.cat === cat);
    });
  }

  tabs.forEach(btn => {
    btn.addEventListener('click', () => setActive(btn.dataset.cat));
  });

  // support linking directly to a category, e.g. gallery.html#oil
  const hash = window.location.hash.replace('#', '');
  if (hash) setActive(hash);
</script>

</body>
</html>
