<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tina Yang — 作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>

  .hero {
    max-width: 1040px;
    margin: 0 auto;
    padding: 88px 24px 20px;
  }

  .hero p.bio {
    max-width: 46ch;
    font-size: 1rem;
    margin-top: 28px;
    color: var(--ink);
  }

  /* ---------- Category strip ---------- */
  .categories {
    max-width: 900px;
    margin: 8px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .cat-pill {
    font-size: 0.85rem;
    padding: 6px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--slate);
  }

  /* ---------- Work grid ---------- */
  .wall {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 24px 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px 26px;
  }

  .wall .art-frame:nth-child(2) { margin-top: 26px; }
  .wall .art-frame:nth-child(3) { margin-top: -10px; }

  .surface.p1 { background: linear-gradient(135deg, #C9A19B 0%, #B98A85 55%, #74784F 100%); }
  .surface.p2 { background: linear-gradient(135deg, #8FA0A8 0%, #4F5D6B 70%); }
  .surface.p3 { background: linear-gradient(135deg, #D2A46E 0%, #B98A85 80%); }

  @media (max-width: 780px) {
    .wall { grid-template-columns: repeat(2, 1fr); }
    .wall .art-frame:nth-child(3) { display: none; }
  }
  @media (max-width: 540px) {
    .wall { grid-template-columns: 1fr; }
  }

  /* ---------- About ---------- */
  .about {
    max-width: 620px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  .about h2 {
    font-size: 1.6rem;
    font-style: italic;
    margin-bottom: 16px;
  }

  .contact-row {
    display: flex;
    gap: 22px;
    margin-top: 26px;
    flex-wrap: wrap;
  }

  .contact-row a {
    text-decoration: none;
    color: var(--rose);
    font-size: 0.95rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }

  .contact-row a:hover { border-color: var(--rose); }

  footer {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px 60px;
    color: var(--slate);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="brand">Tina Yang</div>
  <div class="links">
    <a href="index.html" class="active">主页</a>
